# -*- mode: conf; coding: utf-8 -*-

# Local ISTAF service, pyicebox config
IceBox.Service.ISTopicAsFacet = istaf.Service --Ice.Config=istaf.cfg
IceBox.ServiceManager.Endpoints = tcp -p 21000
IceBox.PrintServicesReady = ISTAF Service

# Local ISTAF service, ISTAF config
Freeze.DbEnv.IceStorm.DbHome = /tmp/dummy-istaf-db
ISTopicAsFacet.TopicManager.Endpoints = tcp -p 11000
ISTopicAsFacet.Publish.Endpoints = tcp -p 11001
IceStorm.TopicManager.Proxy = IceStorm/TopicManager -t:tcp -p 10000

