# -*- mode: conf; coding: utf-8 -*-

# Local IceStorm service, icebox config
IceBox.Service.IceStorm = IceStormService:createIceStorm --Ice.Config=icestorm.cfg
IceBox.ServiceManager.Endpoints = tcp -h 127.0.0.1 -p 20000
IceBox.PrintServicesReady = IceStorm Service

# Local IceStorm service, IceStorm config
Freeze.DbEnv.IceStorm.DbHome = /tmp/icestorm-db
IceStorm.TopicManager.Endpoints = tcp -h 127.0.0.1 -p 10000
IceStorm.Publish.Endpoints = tcp -h 127.0.0.1 -p 10001
